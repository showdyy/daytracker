/* ---------------- events */
function bind() {
  $('#prev')?.addEventListener('click', () => { haptic('select'); load(shift(view, -1)) });
  $('#next')?.addEventListener('click', () => { haptic('select'); load(shift(view, 1)) });
  $('#gotoday')?.addEventListener('click', () => { haptic('select'); load() });
  $('#carry')?.addEventListener('click', () => { haptic(); mutate('/api/carry', {}, 'Дела перенесены') });
  $('#tpl')?.addEventListener('click', () => { haptic('medium'); mutate('/api/template', {}, 'Рутина готова ✨') });
  $$('[data-water]').forEach(b => b.onclick = () => { haptic('medium'); mutate('/api/add', {type: 'water', ml: +b.dataset.water}, `+${b.dataset.water} мл 💧`) });
  $$('[data-open]').forEach(b => b.onclick = () => openSheet(b.dataset.open));
  $$('[data-go]').forEach(b => b.onclick = () => { haptic('medium'); mutate('/api/toggle', {kind: 'habit', id: +b.dataset.go}, 'Готово ✓') });
  $$('[data-mood]').forEach(b => b.onclick = () => { haptic('select'); mutate('/api/add', {type: 'mood', score: +b.dataset.mood}) });
  $$('[data-slot]').forEach(b => b.onclick = () => { slot = b.dataset.slot; haptic('select'); render() });
  $$('[data-toggle]').forEach(r => r.onclick = e => {
    if (e.target.closest('[data-del]')) return;
    const [kind, id] = r.dataset.toggle.split(':');
    if (view !== S.today) return toast('Отмечать можно только сегодня');
    r.classList.toggle('done'); haptic(r.classList.contains('done') ? 'medium' : 'light');
    mutate('/api/toggle', {kind, id: +id});
  });
  $$('[data-row]').forEach(r => r.onclick = e => {
    if (e.target.closest('[data-del]')) return;
    const was = r.classList.contains('armed');
    $$('.armed').forEach(x => x.classList.remove('armed'));
    if (!was) { r.classList.add('armed'); haptic('select') }
  });
  $$('[data-del]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [kind, id] = b.dataset.del.split(':');
    haptic('heavy'); mutate('/api/delete?day=' + view, {kind, id: +id}, 'Удалено');
  });
  $$('form[data-add]').forEach(f => f.onsubmit = e => {
    e.preventDefault();
    const v = f.querySelector('input').value.trim();
    if (!v) return;
    haptic(); refocus = f.dataset.add;
    mutate('/api/add', {type: f.dataset.add, text: v, slot});
  });
  $$('[data-step]').forEach(b => b.onclick = () => {
    const [field, dir] = b.dataset.step.split(':'), g = GOALS.find(x => x.f === field), out = $('#g-' + field);
    const next = Math.round((parseFloat(out.textContent.replace(/\s/g, '').replace(',', '.')) + g.step * +dir) * 10) / 10;
    out.textContent = fmt(next, 1); haptic('select');
    window._gt = window._gt || {}; clearTimeout(window._gt[field]);
    window._gt[field] = setTimeout(() => mutate('/api/goal', {field, value: next}, 'Сохранено'), 600);
  });
  $$('[data-cur]').forEach(b => b.onclick = () => { haptic('select'); mutate('/api/money-cfg', {currency: b.dataset.cur}) });
  $('#mSave')?.addEventListener('click', () => { haptic('medium'); mutate('/api/money-cfg', {budget: $('#mBudget').value, income: $('#mIncome').value}, 'Сохранено') });
  $$('[data-money-focus]').forEach(b => b.onclick = () => { const i = $('#mBudget'); i?.scrollIntoView({behavior: 'smooth', block: 'center'}); setTimeout(() => i?.focus(), 400) });
  $$('[data-recat]').forEach(sel => { sel.onclick = e => e.stopPropagation(); sel.onchange = () => { haptic('select'); mutate('/api/money-cat?day=' + view, {id: +sel.dataset.recat, cat: sel.value}, 'Категория изменена') } });
  $$('[data-theme-set]').forEach(b => b.onclick = () => { haptic('select'); setTheme(b.dataset.themeSet); const y = scrollY; render(); scrollTo(0, y) });
  $('#installBtn')?.addEventListener('click', async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; render() });
  $('#installHide')?.addEventListener('click', () => { try { localStorage.setItem('install-hidden', '1') } catch (e) {} render() });
  $('#exportBtn')?.addEventListener('click', async () => {
    const name = `daytracker-${Core.today()}.json`, blob = new Blob([Core.exportJSON()], {type: 'application/json'});
    const file = new File([blob], name, {type: 'application/json'});
    if (navigator.canShare?.({files: [file]})) { try { await navigator.share({files: [file], title: 'Трекер дня — копия'}); return } catch (e) { if (e.name === 'AbortError') return } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Копия сохранена');
  });
  $('#importBtn')?.addEventListener('click', () => $('#importFile').click());
  $('#importFile')?.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm('Заменить все текущие записи данными из файла?')) return;
    try { Core.importJSON(await f.text()); toast('Данные загружены ✨'); load() } catch (err) { toast(err.message || 'Не удалось прочитать файл') }
  });
  $$('[data-pf]').forEach(b => b.onclick = () => { const [k, v] = b.dataset.pf.split(':'); PF[k] = k === 'activity' ? +v : v; haptic('select'); const y = scrollY; render(); scrollTo(0, y) });
  $$('[data-pfi]').forEach(i => i.oninput = () => { PF[i.dataset.pfi] = i.value.replace(',', '.') });
  $('#calc')?.addEventListener('click', async () => {
    haptic('medium');
    if (await mutate('/api/profile', {sex: PF.sex, age: PF.age, height: PF.height, weight: PF.weight, activity: PF.activity, goal: PF.goal}, 'Норма рассчитана ✨')) { PF = null; render(); scrollTo({top: 0, behavior: 'smooth'}) }
  });
  $$('[data-jump]').forEach(b => b.onclick = () => $('#' + b.dataset.jump)?.scrollIntoView({behavior: 'smooth', block: 'start'}));
  $('#wprev')?.addEventListener('click', () => { haptic('select'); load(shift(view, -7)) });
  $('#wnext')?.addEventListener('click', () => { haptic('select'); const n = shift(view, 7); load(n > S.today ? S.today : n) });
  $$('[data-goday]').forEach(b => b.onclick = () => { haptic('select'); tab = 'today'; $$('.dock .tb').forEach(x => x.classList.toggle('on', x.dataset.tab === 'today')); load(b.dataset.goday).then(() => scrollTo(0, 0)) });
  $$('[data-tab-go]').forEach(b => b.onclick = () => { tab = b.dataset.tabGo; $$('.dock .tb').forEach(x => x.classList.toggle('on', x.dataset.tab === tab)); render(); scrollTo(0, 0) });
  $$('[data-tip]').forEach(el => el.onclick = () => { if (!el.dataset.tip) return; const r = el.getBoundingClientRect(); haptic('select'); tip(r.left + r.width / 2, r.top, el.dataset.tip) });
  const wc = $('#wchart');
  if (wc && window._wc) {
    const {H, X, Y, Wd, Ht, dl} = window._wc;
    const move = e => {
      const r = wc.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * Wd;
      let best = 0; H.forEach((p, i) => { if (Math.abs(X(i) - x) < Math.abs(X(best) - x)) best = i });
      const p = H[best], cx = X(best), cy = Y(p.kg);
      $('#wx').setAttribute('x1', cx); $('#wx').setAttribute('x2', cx); $('#wp').setAttribute('cx', cx); $('#wp').setAttribute('cy', cy);
      tip(r.left + cx / Wd * r.width, r.top + cy / Ht * r.height, `<b>${fmt(p.kg, 1)} кг</b><small>${dl(p.day)}</small>`);
    };
    wc.addEventListener('pointermove', move); wc.addEventListener('pointerdown', move);
  }
}
$$('.dock .tb').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; haptic('select');
  $$('.dock .tb').forEach(x => x.classList.toggle('on', x === b));
  render(); scrollTo(0, 0);
});
$('#fab').onclick = () => openSheet(sheetType);
$('#scrim').onclick = closeSheet;

/* ---------------- sheet */
function openSheet(type) {
  if (S && view !== S.today) load();
  sheetType = type || 'food'; haptic('medium'); renderSheet();
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  try { tg.BackButton.show() } catch (e) {}
  if (!TYPES[sheetType].presets) setTimeout(() => $('#sheetText')?.focus(), 330);
}
function closeSheet() {
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  try { tg.BackButton.hide() } catch (e) {}
  document.activeElement?.blur();
}
function renderSheet() {
  const T = TYPES[sheetType];
  $('#sheetBody').innerHTML = `<h3>${T.title}</h3>
    <div class="types">${Object.entries(TYPES).map(([k, t]) => `<button data-type="${k}" class="${k === sheetType ? 'on' : ''}">${t.n}</button>`).join('')}</div>
    ${T.presets ? `<div class="presets">${T.presets.map(p => `<button data-p="${p}">${String(p).replace('.', ',')}${T.unit}</button>`).join('')}</div>` : ''}
    <textarea id="sheetText" class="${T.multi ? '' : 'one'}" placeholder="${esc(T.ph)}" ${T.multi ? '' : 'inputmode="decimal"'} rows="${T.multi ? 3 : 1}"></textarea>
    ${T.hint ? `<div class="shint">${esc(T.hint)}</div>` : ''}
    <div class="preview" id="preview"></div>
    <button class="submit" id="submit" disabled>Записать</button>`;
  $$('#sheetBody [data-type]').forEach(b => b.onclick = () => { sheetType = b.dataset.type; haptic('select'); renderSheet(); if (!TYPES[sheetType].presets) $('#sheetText').focus() });
  $$('#sheetBody [data-p]').forEach(b => b.onclick = async () => {
    haptic('medium');
    const body = sheetType === 'water' ? {type: 'water', ml: +b.dataset.p} : {type: 'sleep', hours: b.dataset.p};
    if (await mutate('/api/add', body, sheetType === 'water' ? `+${b.dataset.p} мл 💧` : 'Сон записан 😴')) closeSheet();
  });
  const ta = $('#sheetText');
  ta.oninput = () => { clearTimeout(pvTimer); pvTimer = setTimeout(preview, 250) };
  ta.onkeydown = e => { if (e.key === 'Enter' && (!T.multi || e.ctrlKey || e.metaKey)) { e.preventDefault(); submit() } };
  $('#submit').onclick = submit;
}
async function preview() {
  const text = $('#sheetText').value;
  if (!text.trim()) { $('#preview').innerHTML = ''; $('#submit').disabled = true; return }
  try {
    const {items} = await api('/api/preview', {type: sheetType, text});
    $('#preview').innerHTML = items.map(it => `<div class="pv ${it.ok ? '' : 'bad'}"><b>${esc(it.name)}${it.detail || it.sub ? `<span class="det">${esc([it.detail, it.sub].filter(Boolean).join(' · '))}</span>` : ''}</b><span>${esc(it.value)}</span></div>`).join('');
    $('#submit').disabled = !items.length;
  } catch (e) {}
}
async function submit() {
  const text = $('#sheetText').value.trim();
  if (!text) return;
  $('#submit').disabled = true;
  const ok = await mutate('/api/add', {type: sheetType, text}, {food: 'Записано 🍽', workout: 'Тренировка записана 💪', water: 'Вода записана 💧', sleep: 'Сон записан 😴', weight: 'Вес записан', money: 'Записал 💸'}[sheetType]);
  if (ok) { if (tab !== 'today') { tab = 'today'; $$('.dock .tb').forEach(x => x.classList.toggle('on', x.dataset.tab === 'today')); render() } closeSheet() }
  else $('#submit').disabled = false;
}

setInterval(() => { if (S && view === S.today && !$('#sheet').classList.contains('on') && !document.activeElement?.matches('input,textarea')) load() }, 60000);
load();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
