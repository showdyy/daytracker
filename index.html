<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script>(function(){var t='sky';try{t=localStorage.getItem('theme')||'sky'}catch(e){}document.documentElement.dataset.theme=t})()</script>
<title>Трекер дня</title>
<meta name="theme-color" content="#121116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Трекер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="foods-data.js"></script>
<script src="money.js"></script>
<script src="core.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070D;
  --glass:rgba(255,255,255,.065); --glass-2:rgba(255,255,255,.1); --glass-3:rgba(255,255,255,.16); --stroke:rgba(255,255,255,.11);
  --ink:#FFFFFF; --ink-2:rgba(255,255,255,.62); --ink-3:rgba(255,255,255,.38);
  --kcal:#FF5C8A; --water:#3DD5F3; --routine:#A6F25C; --sleep:#A98BFF; --gold:#FFC857; --danger:#FF5A5F;
  --font:'Onest',-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:24px; --safe-b:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
  --on-accent:#0B0B10; --sunken:rgba(0,0,0,.25); --dock-bg:rgba(20,20,30,.6); --sheet-bg:rgba(24,22,36,.92);
  --g1:#7C5CFF; --g2:#FF5C8A; --grad:linear-gradient(135deg,var(--g1),var(--g2)); --grad-glow:rgba(255,92,138,.55);
  --a1:#6D4AFF; --a2:#FF4D9A; --a3:#1F8BFF; --aurora-op:.55; --card-shadow:none; --toast-bg:rgba(255,255,255,.95); --toast-ink:#0B0B10;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F4F8; --glass:rgba(255,255,255,.85); --glass-2:rgba(15,23,42,.06); --glass-3:rgba(15,23,42,.1); --stroke:rgba(15,23,42,.07);
  --ink:#0F172A; --ink-2:rgba(15,23,42,.6); --ink-3:rgba(15,23,42,.38);
  --kcal:#FF4D6D; --water:#0EA5E9; --routine:#22C55E; --sleep:#8B5CF6; --gold:#F59E0B; --danger:#EF4444;
  --on-accent:#FFFFFF; --sunken:rgba(15,23,42,.05); --dock-bg:rgba(255,255,255,.88); --sheet-bg:rgba(255,255,255,.97);
  --g1:#3B82F6; --g2:#8B5CF6; --grad-glow:rgba(99,102,241,.45);
  --a1:#C7D2FE; --a2:#FBCFE8; --a3:#BAE6FD; --aurora-op:.75;
  --card-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 26px -14px rgba(15,23,42,.2); --toast-bg:#0F172A; --toast-ink:#FFFFFF;
  color-scheme:light;
}
:root[data-theme="cozy"]{
  --bg:#F5EFE6; --glass:rgba(255,252,247,.92); --glass-2:rgba(80,60,40,.07); --glass-3:rgba(80,60,40,.12); --stroke:rgba(80,60,40,.08);
  --ink:#2E2823; --ink-2:rgba(46,40,35,.62); --ink-3:rgba(46,40,35,.4);
  --kcal:#C9714D; --water:#6E9CC2; --routine:#6F8F72; --sleep:#8C7FBE; --gold:#D29B4A; --danger:#C2453A;
  --on-accent:#FFFFFF; --sunken:rgba(80,60,40,.06); --dock-bg:rgba(255,252,247,.94); --sheet-bg:#FFFCF7;
  --g1:#6F8F72; --g2:#C9714D; --grad-glow:rgba(201,113,77,.35);
  --a1:#E8D9C4; --a2:#F3D5C6; --a3:#DCE7D6; --aurora-op:.85;
  --card-shadow:0 1px 2px rgba(80,60,40,.05),0 10px 26px -14px rgba(80,60,40,.28); --toast-bg:#2E2823; --toast-ink:#F5EFE6;
  --font:'Nunito',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="mono"]{
  --bg:#000000; --glass:#0E0E0E; --glass-2:rgba(255,255,255,.08); --glass-3:rgba(255,255,255,.15); --stroke:rgba(255,255,255,.12);
  --ink:#FFFFFF; --ink-2:rgba(255,255,255,.6); --ink-3:rgba(255,255,255,.36);
  --kcal:#FFFFFF; --water:#A3A3A3; --routine:#D9D9D9; --sleep:#8C8C8C; --gold:#E5E5E5; --danger:#FF5A5F;
  --on-accent:#000000; --sunken:rgba(255,255,255,.05); --dock-bg:rgba(14,14,14,.92); --sheet-bg:#0E0E0E;
  --g1:#FFFFFF; --g2:#BDBDBD; --grad-glow:rgba(255,255,255,.18);
  --aurora-op:0; --card-shadow:none; --toast-bg:#FFFFFF; --toast-ink:#000000;
  color-scheme:dark;
}
:root[data-theme="mono"] .fab svg,:root[data-theme="mono"] .submit,:root[data-theme="mono"] .calc,:root[data-theme="mono"] .cta{color:#000;stroke:#000}
:root[data-theme="sunset"]{
  --bg:#1A0F14; --glass:rgba(255,240,230,.07); --glass-2:rgba(255,240,230,.1); --glass-3:rgba(255,240,230,.16); --stroke:rgba(255,220,200,.12);
  --ink:#FFF4EC; --ink-2:rgba(255,244,236,.65); --ink-3:rgba(255,244,236,.4);
  --kcal:#FF6B6B; --water:#4FD1C5; --routine:#FFD166; --sleep:#C084FC; --gold:#FFB86B; --danger:#FF5A5F;
  --on-accent:#2A1210; --sunken:rgba(0,0,0,.22); --dock-bg:rgba(40,18,24,.65); --sheet-bg:rgba(40,20,26,.95);
  --g1:#FF8A4C; --g2:#FF3D77; --grad-glow:rgba(255,90,100,.55);
  --a1:#FF7A45; --a2:#FF2E7E; --a3:#7C3AED; --aurora-op:.5;
  --toast-bg:#FFF4EC; --toast-ink:#2A1210;
  color-scheme:dark;
}
:root[data-theme="light"] .check.done .box,:root[data-theme="cozy"] .check.done .box{box-shadow:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{min-height:100vh;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--aurora-op);animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:340px;height:340px;background:var(--a1);top:-120px;left:-90px}
.aurora i:nth-child(2){width:300px;height:300px;background:var(--a2);top:180px;right:-140px;opacity:calc(var(--aurora-op) * .7);animation-delay:-6s}
.aurora i:nth-child(3){width:320px;height:320px;background:var(--a3);bottom:-140px;left:10%;opacity:calc(var(--aurora-op) * .75);animation-delay:-12s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.15)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:max(12px, env(safe-area-inset-top)) 14px calc(104px + var(--safe-b))}
.install{display:flex;gap:12px;align-items:center;padding:12px 14px;margin:0 0 12px}
.install b{display:block;font-size:14.5px}.install small{color:var(--ink-2);font-size:13px;line-height:1.35;display:block}
.install .go{flex:none;background:var(--ink);color:var(--bg);font-weight:800;font-size:13.5px;padding:9px 12px;border-radius:12px}
.install .x{flex:none;color:var(--ink-3);font-size:20px;width:28px}
body{overscroll-behavior-y:none}
.tab{display:none}.tab.on{display:block;animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:scale(.99)}}
.glass{background:var(--glass);box-shadow:var(--card-shadow);border:1px solid var(--stroke);border-radius:var(--r);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 14px}
.head small{font-size:13px;color:var(--ink-2);font-weight:600;text-transform:capitalize}
.head h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.nav{display:flex;gap:6px}
.nav button{height:36px;min-width:36px;padding:0 10px;border-radius:18px;font-size:18px;font-weight:700}
.nav button:disabled{opacity:.3}
.nav .today{font-size:13px}

/* bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w{padding:14px;text-align:left;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.w:active{transform:scale(.98)}
.w .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.w .lbl i{width:8px;height:8px;border-radius:50%}
.w .val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.w .val span{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.w .hint{font-size:12px;color:var(--ink-3);margin-top:auto;padding-top:6px}
.rings{grid-row:span 2;align-items:center;justify-content:center;padding:14px 10px}
.rings svg{width:100%;max-width:160px;aspect-ratio:1}
.rings circle{fill:none;stroke-linecap:round;stroke-width:13}
.rings .tr{opacity:.16}
.rings .fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px currentColor)}
.legend{display:grid;gap:3px;width:100%;margin-top:10px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}
.legend b{color:var(--ink);margin-left:auto;font-weight:700}
.wfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(61,213,243,.28),rgba(61,213,243,.12));transition:height .6s ease;z-index:-1}
.wide{grid-column:span 2}
.moods{display:flex;justify-content:space-between;margin-top:6px}
.moods button{font-size:21px;width:30px;height:34px;border-radius:10px;opacity:.35;filter:grayscale(1);transition:all .2s}
.moods button.on{opacity:1;filter:none;background:var(--glass-3);transform:scale(1.12)}
.next{flex-direction:row;align-items:center;gap:12px}
.next .t{flex:1;min-width:0}
.next .t b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.next .go{flex:none;background:var(--routine);color:var(--on-accent);font-weight:800;font-size:14px;padding:10px 14px;border-radius:14px}

/* sections */
.h2{display:flex;align-items:baseline;justify-content:space-between;margin:24px 6px 10px}
.h2 h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.h2 span{font-size:13.5px;color:var(--ink-2);font-weight:600}
.h2 button{font-size:14px;color:var(--water);font-weight:700}
.card{padding:4px 16px}
.card.pad{padding:14px 16px}
.seg{display:flex;gap:2px;background:var(--sunken);border-radius:14px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:13.5px;font-weight:700;display:flex;justify-content:center;gap:5px;color:var(--ink-2)}
.seg button span{color:var(--ink-3);font-weight:600}
.seg button.on{background:var(--glass-3);color:var(--ink)}
.seg button.on span{color:var(--ink-2)}
.check{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--stroke);cursor:pointer}
.check:first-child,.seg + .check{border-top:0}
.box{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;transition:all .2s}
.box svg{width:13px;height:13px;stroke:var(--on-accent);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check.done .box{background:var(--routine);border-color:var(--routine);box-shadow:0 0 12px rgba(166,242,92,.5)}
.check.task.done .box{background:var(--water);border-color:var(--water);box-shadow:0 0 12px rgba(61,213,243,.5)}
.check.done .box svg{opacity:1}
.check.done .txt{color:var(--ink-3);text-decoration:line-through}
.check .txt{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:2px}
.streak{font-size:12.5px;font-weight:700;color:var(--gold);white-space:nowrap}
.del{color:var(--ink-3);font-size:20px;width:30px;height:30px;border-radius:50%}
.adder{display:flex;gap:8px;align-items:center;padding:8px 0 10px;border-top:1px solid var(--stroke)}
.adder:first-child{border-top:0}
.adder input{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:6px 0;font-size:16px}
.adder input::placeholder{color:var(--ink-3)}
.adder button{width:32px;height:32px;border-radius:50%;background:var(--glass-2);font-size:20px;font-weight:700;line-height:1}
.empty{color:var(--ink-2);font-size:14.5px;padding:12px 0}
.cta{width:100%;padding:13px;margin:4px 0 12px;border-radius:16px;background:var(--grad);color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 24px -8px var(--grad-glow)}

.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--stroke);position:relative}
.row:first-child,.stats + .row{border-top:0}
.row .t{font-size:13.5px;color:var(--ink-3);font-weight:600;min-width:40px}
.row .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.row .n i{width:8px;height:8px;border-radius:50%;flex:none}
.row .n small{color:var(--ink-3);font-size:12.5px}
.row .v{font-size:14.5px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.row .x{position:absolute;right:0;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;background:var(--danger);border-radius:12px;padding:7px 13px;font-size:13.5px;font-weight:700;transition:opacity .15s}
.row.armed .v{opacity:0}
.row.armed .x{opacity:1;pointer-events:auto}

.kc{display:flex;align-items:baseline;gap:6px}
.kc b{font-size:32px;font-weight:800;letter-spacing:-.03em}
.kc span{color:var(--ink-2);font-weight:600}
.pbar{height:8px;border-radius:4px;background:var(--glass-2);margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#FF8A5C,var(--kcal));transition:width .6s}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.macro{background:var(--sunken);border-radius:14px;padding:9px 11px}
.macro small{display:block;font-size:12px;color:var(--ink-2);font-weight:600}
.macro b{font-size:17px;font-weight:800}
.macro b span{font-size:12px;color:var(--ink-3);font-weight:600}
.stats{display:flex;gap:20px;flex-wrap:wrap;padding:12px 0 8px}
.stats small{display:block;font-size:12px;color:var(--ink-2);font-weight:600}
.stats b{font-size:19px;font-weight:800}

/* week */
.heat{display:grid;grid-template-columns:60px repeat(7,1fr);gap:4px;padding:12px 0}
.heat .h{font-size:12px;color:var(--ink-2);text-align:center;font-weight:600;padding-bottom:4px;line-height:1.2}
.heat .h.today{color:var(--routine)}
.heat .rl{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;font-weight:600}
.heat .c{height:34px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;font-size:11px;font-weight:700;position:relative;overflow:hidden;isolation:isolate}
.heat .c::before{content:"";position:absolute;inset:0;background:var(--hc);opacity:var(--o,0);z-index:-1}
.heat .c.none{color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}
.stat small{font-size:12.5px;color:var(--ink-2);font-weight:600;display:block}
.stat b{font-size:22px;font-weight:800}
.stat span{font-size:12.5px;color:var(--ink-3);display:block}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.big span{font-size:14px;color:var(--ink-2);font-weight:600;margin-left:5px}
.chart{width:100%;height:170px;display:block;touch-action:pan-y;margin-top:6px}
.chart .gl line{stroke:var(--stroke)}
.chart .ax{fill:var(--ink-3);font-size:11px;font-family:var(--font)}
.chart .ln{fill:none;stroke:url(#lg);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.chart .pt{fill:var(--bg);stroke:var(--g2);stroke-width:2.5}

/* goals */
.goal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--stroke)}
.goal:first-child{border-top:0}
.goal div{font-weight:600}
.goal small{display:block;color:var(--ink-2);font-size:13px;font-weight:500}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:12px;background:var(--glass-2);font-size:20px;font-weight:700}
.stepper output{font-size:18px;font-weight:800;min-width:62px;text-align:center}
.note{color:var(--ink-2);font-size:14px;line-height:1.55;padding:14px 6px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:16px 8px}
.th{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.th i{width:48px;height:48px;border-radius:16px;position:relative;box-shadow:0 0 0 1px var(--stroke);transition:transform .15s}
.th i b{position:absolute;inset:13px;border-radius:50%}
.th.on{color:var(--ink)}
.th.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink);transform:scale(1.04)}
.mhero .kc b{font-size:34px}
.msub{font-size:14px;color:var(--ink-2);margin-top:8px}.msub b{color:var(--ink)}
.mset{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--glass-2);font-weight:700;font-size:14.5px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mstats div{background:var(--sunken);border-radius:14px;padding:9px 10px}
.mstats small{display:block;font-size:12px;color:var(--ink-2);font-weight:600}
.mstats b{font-size:15px;font-weight:800;white-space:nowrap}
.madd{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 8px 8px 16px}
.madd input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;padding:8px 0}
.madd input::placeholder{color:var(--ink-3)}
.madd button{width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;font-size:24px;font-weight:700;line-height:1;flex:none}
.tips{display:flex;flex-direction:column;gap:8px}
.tip-card{display:flex;gap:12px;padding:13px 14px;align-items:flex-start}
.tip-card .tic{font-size:22px;line-height:1.2}
.tip-card b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.tip-card small{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.45;margin-top:3px}
.tip-card.warn{border-color:color-mix(in oklab,var(--danger) 45%,transparent)}
.tip-card.ok{border-color:color-mix(in oklab,var(--routine) 45%,transparent)}
.mcat{display:flex;gap:12px;align-items:center;padding:8px 0}
.mcat + .mcat{border-top:1px solid var(--stroke)}
.mic{font-size:22px;width:30px;text-align:center}
.mcn{flex:1;min-width:0}
.mcn div{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.mcn div span{font-weight:700;white-space:nowrap}
.mcn small{font-size:12px;color:var(--ink-3)}
.mbar{height:6px;border-radius:3px;background:var(--glass-2);margin:6px 0 4px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;transition:width .6s}
.mday{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:14px 0 4px}
.mday:first-child{padding-top:10px}
.mrow .t{font-size:20px;min-width:28px}
.mrow .n small{display:inline;color:var(--ink-3);font-size:12.5px;margin-left:4px}
.mrow .v.inc{color:var(--routine)}
.mrow .mx{display:flex;gap:6px;align-items:center;background:transparent;padding:0}
.mrow .mx select{max-width:150px;background:var(--glass-2);color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:6px 8px;font:inherit;font-size:13px}
.mrow .mx button{background:var(--danger);color:#fff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
.mrow.armed .n{opacity:.25}
.form{display:grid;gap:12px;padding:14px 16px}
.form label{font-size:12.5px;color:var(--ink-2);font-weight:600;display:block;margin-bottom:6px}
.trio3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inp{width:100%;background:var(--sunken);border:1px solid var(--stroke);border-radius:14px;padding:11px 12px;font-size:17px;font-weight:700;outline:none}
.inp:focus{border-color:var(--ink-3)}
.inp-wrap{position:relative}.inp-wrap span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px;pointer-events:none}
.opts{display:grid;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:14px;background:var(--sunken);border:1px solid transparent}
.opt b{font-weight:700;font-size:15px}.opt small{display:block;color:var(--ink-3);font-size:12.5px}
.opt.on{border-color:var(--routine);background:rgba(166,242,92,.08)}
.opt i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-3);flex:none}
.opt.on i{border:5px solid var(--routine)}
.seg.f{margin:0}
.calc{width:100%;padding:14px;border-radius:16px;background:var(--grad);color:#fff;font-weight:800;font-size:16px}
.norm{padding:16px}
.norm .top{display:flex;align-items:baseline;gap:8px}
.norm .top b{font-size:40px;font-weight:800;letter-spacing:-.03em}
.norm .top span{color:var(--ink-2);font-weight:600}
.ngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.ngrid div{background:var(--sunken);border-radius:14px;padding:10px 8px;text-align:center}
.ngrid small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600}
.ngrid b{font-size:18px;font-weight:800}
.norm p{font-size:13px;color:var(--ink-3);margin-top:10px;line-height:1.45}
.mb{height:4px;border-radius:2px;background:var(--glass-2);margin-top:7px;overflow:hidden}
.mb i{display:block;height:100%;border-radius:2px;transition:width .6s}
.pv .det{display:block;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px;white-space:normal}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:20;display:flex;align-items:center;gap:4px;padding:6px;border-radius:26px;
  background:var(--dock-bg);border:1px solid var(--stroke);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.dock .tb{width:64px;height:46px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);font-size:11px;font-weight:700}
.dock .tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock .tb.on{color:var(--ink);background:var(--glass-2)}
.fab{width:52px;height:52px;border-radius:20px;background:var(--grad);display:grid;place-items:center;margin:0 4px;box-shadow:0 8px 20px -6px var(--grad-glow)}
.fab:active{transform:scale(.92)}
.fab svg{width:22px;height:22px;stroke:#fff;stroke-width:2.8;stroke-linecap:round}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;background:var(--sheet-bg);border:1px solid var(--stroke);border-bottom:0;border-radius:28px 28px 0 0;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  padding:10px 16px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-height:90vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--glass-3);margin:0 auto 12px}
.sheet h3{font-size:20px;font-weight:800;text-align:center}
.types{display:flex;gap:6px;overflow-x:auto;margin:14px 0 12px;scrollbar-width:none}
.types::-webkit-scrollbar{display:none}
.types button{flex:none;padding:8px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);font-size:14px;font-weight:700;color:var(--ink-2)}
.types button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.presets button{background:var(--glass-2);border-radius:14px;padding:10px 13px;font-size:15px;font-weight:700}
.sheet textarea{width:100%;min-height:92px;resize:none;background:var(--sunken);border:1px solid var(--stroke);border-radius:16px;padding:13px;outline:none;font-size:16px;line-height:1.45}
.sheet textarea.one{min-height:0;height:50px}
.sheet textarea::placeholder{color:var(--ink-3)}
.shint{font-size:13px;color:var(--ink-2);margin:8px 4px 0;line-height:1.45}
.preview{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pv{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:var(--glass)}
.pv b{font-weight:600;min-width:0;flex:1}
.pv span{white-space:nowrap;font-weight:800}
.pv small{color:var(--ink-2);font-size:12.5px;margin-left:6px;font-weight:600}
.pv.bad span{color:var(--danger)}
.submit{width:100%;margin-top:14px;padding:15px;border-radius:18px;background:var(--grad);color:#fff;font-size:17px;font-weight:800}
.submit:disabled{opacity:.35}

.toast{position:fixed;left:50%;top:calc(12px + var(--tg-content-safe-area-inset-top,0px));transform:translate(-50%,-170%);z-index:60;background:var(--toast-bg);color:var(--toast-ink);font-weight:700;font-size:14.5px;padding:10px 18px;border-radius:18px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--toast-bg);color:var(--toast-ink);padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .15s;max-width:220px;transform:translate(-50%,-100%)}
.tip.on{opacity:1}
.tip small{display:block;opacity:.65;font-size:12px}
.gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.gate h1{font-size:26px;font-weight:800}
.gate p{color:var(--ink-2)}
.skel{height:220px;border-radius:var(--r);margin-top:70px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== тема «Блокнот»: bullet journal, стикеры, панч-карта, чек ===================== */
.rc{display:none}
:root[data-theme="paper"]{
  --bg:#F6F2EA; --glass:#FFFDF8; --glass-2:rgba(43,42,51,.06); --glass-3:rgba(43,42,51,.1); --stroke:rgba(43,42,51,.09);
  --ink:#2B2A33; --ink-2:rgba(43,42,51,.62); --ink-3:rgba(43,42,51,.38);
  --kcal:#EE7B5B; --water:#5E9BD6; --routine:#5FAE70; --sleep:#9B86D6; --gold:#E2A33B; --danger:#D9483B;
  --on-accent:#FFFFFF; --sunken:rgba(43,42,51,.05); --dock-bg:#FFFDF8; --sheet-bg:#FFFDF8;
  --g1:#F08A5D; --g2:#E5533D; --grad-glow:rgba(229,83,61,.35);
  --aurora-op:0; --card-shadow:0 1px 0 rgba(43,42,51,.05),0 14px 26px -18px rgba(90,60,30,.5);
  --toast-bg:#2B2A33; --toast-ink:#FFFDF8;
  --butter:#FFF0BC; --sky:#DCEAFB; --lilac:#ECE3FB; --blush:#FCE1DA; --sage:#DFEED6;
  --hand:'Caveat','Comic Sans MS',cursive; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="paper"] body{background-color:var(--bg);background-image:radial-gradient(rgba(43,42,51,.16) 1.1px,transparent 1.6px);background-size:20px 20px;background-attachment:fixed}
:root[data-theme="paper"] .glass{backdrop-filter:none;-webkit-backdrop-filter:none}
:root[data-theme="paper"] .head small{font-family:var(--hand);font-size:23px;font-weight:700;color:var(--g2);text-transform:none;letter-spacing:0}
:root[data-theme="paper"] .head h1{font-family:var(--hand);font-size:46px;font-weight:700;letter-spacing:0;line-height:.95}
:root[data-theme="paper"] .h2 h2{font-family:var(--hand);font-size:31px;font-weight:700;letter-spacing:0}
:root[data-theme="paper"] .nav button{background:#FFFDF8;box-shadow:var(--card-shadow)}

/* стикеры-виджеты */
:root[data-theme="paper"] .bento > :nth-child(1){background:var(--butter)}
:root[data-theme="paper"] .bento > :nth-child(2){background:var(--sky)}
:root[data-theme="paper"] .bento > :nth-child(3){background:var(--lilac)}
:root[data-theme="paper"] .bento > :nth-child(4){background:var(--blush)}
:root[data-theme="paper"] .bento > :nth-child(5){background:var(--sage)}
:root[data-theme="paper"] .bento > :nth-child(odd){transform:rotate(-.6deg)}
:root[data-theme="paper"] .bento > :nth-child(even){transform:rotate(.5deg)}
:root[data-theme="paper"] .bento > .w:active{transform:scale(.97)}
:root[data-theme="paper"] .bento .glass{border-color:rgba(43,42,51,.06)}
:root[data-theme="paper"] .bento > :nth-child(1)::before,
:root[data-theme="paper"] .bento > .next::before,
:root[data-theme="paper"] .receipt::before{content:"";position:absolute;top:-3px;left:50%;width:68px;height:17px;transform:translateX(-50%) rotate(-3deg);z-index:2;
  background:repeating-linear-gradient(45deg,rgba(238,123,91,.42) 0 6px,rgba(238,123,91,.24) 6px 12px);border-radius:2px;pointer-events:none}
:root[data-theme="paper"] .bento > .next::before{background:repeating-linear-gradient(-45deg,rgba(95,174,112,.42) 0 6px,rgba(95,174,112,.24) 6px 12px);left:18%;transform:translateX(-50%) rotate(4deg)}
:root[data-theme="paper"] .wfill{background:repeating-linear-gradient(-45deg,rgba(94,155,214,.30) 0 7px,rgba(94,155,214,.18) 7px 14px)}
:root[data-theme="paper"] .rings .fg{filter:none}
:root[data-theme="paper"] .rings .tr{opacity:.22}
:root[data-theme="paper"] .moods button.on{background:rgba(255,255,255,.8)}
:root[data-theme="paper"] .next{border:2px dashed rgba(43,42,51,.14);background:#FFFDF8}
:root[data-theme="paper"] .next .go{border-radius:999px}

/* панч-карта: выполненное — пробитая дырка */
:root[data-theme="paper"] .box{border:2px dashed rgba(43,42,51,.28);background:transparent}
:root[data-theme="paper"] .check.done .box{border:0;background-color:var(--bg);background-image:radial-gradient(rgba(43,42,51,.16) 1px,transparent 1.5px);background-size:6px 6px;
  box-shadow:inset 0 3px 4px rgba(43,42,51,.32),inset 0 -1px 0 rgba(255,255,255,.9),0 1px 0 rgba(255,255,255,.9)}
:root[data-theme="paper"] .check.done .box svg{opacity:0}
:root[data-theme="paper"] .check.done .txt{text-decoration-thickness:2px;text-decoration-color:rgba(229,83,61,.55)}
:root[data-theme="paper"] .check + .check{border-top:1px dashed rgba(43,42,51,.12)}
:root[data-theme="paper"] .streak{font-family:var(--hand);font-size:19px;color:var(--g2);transform:rotate(-5deg);display:inline-block}
:root[data-theme="paper"] .seg{background:rgba(43,42,51,.06)}
:root[data-theme="paper"] .seg button.on{background:#FFFDF8;box-shadow:0 1px 3px rgba(43,42,51,.15)}

/* чек питания */
:root[data-theme="paper"] .receipt{position:relative;border-radius:var(--r) var(--r) 0 0;margin-bottom:10px;overflow:visible}
:root[data-theme="paper"] .receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:radial-gradient(circle at 9px 0,#FFFDF8 8px,transparent 8.6px) 0 0/18px 10px repeat-x}
:root[data-theme="paper"] .rc{display:block;font-family:var(--mono);font-size:12.5px;margin-top:14px;padding-top:10px;border-top:2px dashed rgba(43,42,51,.14)}
:root[data-theme="paper"] .rc-row{display:flex;align-items:baseline;gap:6px;padding:4px 0}
:root[data-theme="paper"] .rc-row span{max-width:64%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root[data-theme="paper"] .rc-row i{flex:1;border-bottom:2px dotted rgba(43,42,51,.22);transform:translateY(-3px)}
:root[data-theme="paper"] .rc-row b{font-weight:700}
:root[data-theme="paper"] .rc-total{margin-top:6px;padding-top:9px;border-top:2px dashed rgba(43,42,51,.14);font-weight:700;font-size:13.5px}
:root[data-theme="paper"] .rc-empty{color:var(--ink-3);padding:4px 0}
:root[data-theme="paper"] .kc b{font-family:var(--mono);font-size:30px}
:root[data-theme="paper"] .pbar i{background:repeating-linear-gradient(-45deg,#EE7B5B 0 6px,#F29B7F 6px 12px)}
:root[data-theme="paper"] .macro{background:rgba(43,42,51,.04);border:1px dashed rgba(43,42,51,.1)}

/* неделя — перфокарта */
:root[data-theme="paper"] .heat .c{border-radius:50%;height:auto;aspect-ratio:1;font-size:9.5px;background:rgba(43,42,51,.05);box-shadow:inset 0 2px 3px rgba(43,42,51,.14)}
:root[data-theme="paper"] .heat .c::before{border-radius:50%}
:root[data-theme="paper"] .stat:nth-child(1){background:var(--butter)}
:root[data-theme="paper"] .stat:nth-child(2){background:var(--sky)}
:root[data-theme="paper"] .stat:nth-child(3){background:var(--lilac)}
:root[data-theme="paper"] .stat:nth-child(4){background:var(--sage)}
:root[data-theme="paper"] .norm .top b,:root[data-theme="paper"] .stat b,:root[data-theme="paper"] .big{font-family:var(--mono)}

/* док, печать «＋», шторка в линейку */
:root[data-theme="paper"] .dock{box-shadow:0 12px 28px -12px rgba(90,60,30,.45);border-color:rgba(43,42,51,.08)}
:root[data-theme="paper"] .dock .tb.on{background:var(--butter);color:var(--ink)}
:root[data-theme="paper"] .fab{border-radius:50%;width:54px;height:54px;box-shadow:0 0 0 4px #FFFDF8,0 0 0 6px rgba(229,83,61,.45),0 8px 18px -6px rgba(229,83,61,.6);transform:rotate(-8deg)}
:root[data-theme="paper"] .fab:active{transform:rotate(-8deg) scale(.9)}
:root[data-theme="paper"] .sheet{box-shadow:0 -10px 30px -12px rgba(90,60,30,.35)}
:root[data-theme="paper"] .sheet h3{font-family:var(--hand);font-size:32px;font-weight:700}
:root[data-theme="paper"] .sheet textarea{background:#FFFDF8 repeating-linear-gradient(transparent 0 27px,rgba(94,155,214,.28) 27px 28px);background-attachment:local;line-height:28px;padding:2px 12px 12px;border:1px solid rgba(43,42,51,.1)}
:root[data-theme="paper"] .pv{background:var(--sage)}
:root[data-theme="paper"] .pv.bad{background:var(--blush)}
:root[data-theme="paper"] .types button:not(.on){background:#FFFDF8}
:root[data-theme="paper"] .toast{border-radius:6px;transform:translate(-50%,-170%) rotate(-1.5deg)}
:root[data-theme="paper"] .toast.on{transform:translate(-50%,0) rotate(-1.5deg)}
:root[data-theme="paper"] .opt.on{background:var(--sage);border-color:var(--routine)}
:root[data-theme="paper"] .norm{background:var(--butter)}
:root[data-theme="paper"] .h2 button,:root[data-theme="paper"] .receipt button.h2{color:var(--g2)!important}

:root[data-theme="night"] .receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;

/* неделя — перфокарта */

/* ===================== новый «День» и «Неделя» ===================== */
.skyarc{display:block;width:100%;height:auto;margin:6px 0 10px;overflow:visible}
.skyarc .arc{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:3 5;stroke-linecap:round}
.skyarc .arc.done{stroke:var(--sun,#FFD27A);stroke-dasharray:none;opacity:.8}
.skyarc .hz{stroke:var(--stroke);stroke-width:1}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}

.hero h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px}

.dring{width:78px;height:78px;position:relative;flex:none}
.dring svg{width:100%;height:100%;transform:rotate(-90deg)}
.dring circle{fill:none;stroke-width:7;stroke-linecap:round}

.dring b small{font-size:11px;font-weight:700;color:var(--ink-2);margin-left:1px}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:2px 14px 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{position:relative;overflow:hidden;flex:none;display:flex;align-items:baseline;gap:5px;padding:10px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--card-shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

.pill > :not(.pf){position:relative}
.pill .pi{font-size:15px}
.pill b{font-size:16px;font-weight:800}
.pill small{font-size:12.5px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.pill:active{transform:scale(.96)}
.now{padding:14px 16px 6px;margin-top:12px}
.now-h{display:flex;gap:12px;align-items:center;margin-bottom:2px}

.now-h b{display:block;font-size:17px;font-weight:800}
.now-h small{color:var(--ink-2);font-size:13px}
.now .check:first-of-type{border-top:0}
.tag{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--glass-2);padding:3px 8px;border-radius:8px;margin-right:2px;white-space:nowrap}
.more{display:block;font-size:13px;color:var(--g1);font-weight:700;padding:6px 0 12px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.qb{display:flex;align-items:center;gap:8px;padding:12px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--card-shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-weight:700;font-size:14px;text-align:left}

.qb:active{transform:scale(.95)}
.moodc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-top:10px}

.moodc .moods{margin:0;gap:2px;justify-content:flex-end}
.feed{position:relative}
.feed::before{content:"";position:absolute;left:67px;top:20px;bottom:20px;width:2px;background:var(--stroke);border-radius:2px}
.row.fd{grid-template-columns:40px 12px 1fr auto;gap:10px}
.fd .t{font-size:13px;color:var(--ink-3);font-weight:600}
.fd .fdot{width:10px;height:10px;border-radius:50%;position:relative;z-index:1;box-shadow:0 0 0 3px var(--glass)}

.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border-radius:14px}
.wd small{font-size:11.5px;color:var(--ink-3);font-weight:700}
.wd b{font-size:15px;font-weight:800}
.wd > span{font-size:15px;min-height:18px;line-height:18px;color:var(--ink-3)}
.wbar{width:14px;height:64px;border-radius:7px;background:var(--glass-2);position:relative;overflow:hidden}
.wbar i{position:absolute;left:0;right:0;bottom:0;border-radius:7px;background:var(--grad);transition:height .7s cubic-bezier(.2,.8,.2,1)}
.wd.td small{color:var(--g1)}
.wd.sel{background:var(--glass-2)}
.wins{display:grid;gap:8px;margin-top:10px}
.win{display:flex;gap:12px;align-items:center;padding:12px 14px}
.win > span{font-size:22px}
.win b{display:block;font-size:14.5px;font-weight:700}
.win small{display:block;font-size:13px;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{padding:12px 12px 10px;display:flex;flex-direction:column}
.mc > small{font-size:12.5px;color:var(--ink-2);font-weight:700}
.mc > b{font-size:22px;font-weight:800;margin-top:2px}
.mc > b span{font-size:13px;color:var(--ink-2);font-weight:600}
.mc > em{font-style:normal;font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.sbars{height:62px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;position:relative}
.sbars span{height:100%;display:flex;align-items:flex-end;cursor:pointer}
.sbars span i{width:100%;border-radius:5px 5px 3px 3px;min-height:0;transition:height .6s}
.sbars .gl{position:absolute;left:-2px;right:-2px;border-top:1.5px dashed var(--ink-3);z-index:1;pointer-events:none}
.sdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:5px}
.sdays span{font-size:10px;color:var(--ink-3);text-align:center;font-weight:700}
.sdays span.td{color:var(--g1)}
.hgrid{display:flex;flex-direction:column;gap:9px}
.hg-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,22px);gap:6px;align-items:center}
.hg-row > span{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hg-head small{font-size:10.5px;color:var(--ink-3);font-weight:700;text-align:center}
.hg-head small.td{color:var(--g1)}
.hg-row i{width:22px;height:22px;border-radius:50%;background:var(--glass-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.hg-row i.on{background:var(--grad);box-shadow:0 0 10px -2px var(--grad-glow)}

/* ===================== тема «Небо»: фон — небо по реальному времени ===================== */
:root[data-theme="sky"]{
  --bg:#141238; --glass:rgba(12,12,38,.36); --glass-2:rgba(255,255,255,.1); --glass-3:rgba(255,255,255,.17); --stroke:rgba(255,255,255,.14);
  --ink:#FFFFFF; --ink-2:rgba(255,255,255,.72); --ink-3:rgba(255,255,255,.46);
  --kcal:#FFB27A; --water:#8EC5FF; --routine:#7FE0B5; --sleep:#C3A6FF; --gold:#FFD27A; --danger:#FF7A7A;
  --on-accent:#141238; --sunken:rgba(0,0,0,.18); --dock-bg:rgba(14,14,42,.5); --sheet-bg:rgba(24,22,60,.96);
  --g1:#FFD27A; --g2:#FF8FA3; --grad-glow:rgba(255,190,130,.45);
  --aurora-op:0; --card-shadow:0 12px 30px -20px rgba(0,0,0,.7); --toast-bg:#FFFFFF; --toast-ink:#141238;
  --sun:#FFD27A; --moon:#F3F0FF;
  color-scheme:dark;
}
:root[data-theme="sky"][data-sky="night"]{--skybg:linear-gradient(180deg,#05081A 0%,#10123A 55%,#221547 100%);--star-op:1;--bg:#0B0E28}
:root[data-theme="sky"][data-sky="dawn"]{--skybg:linear-gradient(180deg,#1A1A48 0%,#4B2B6B 38%,#B65E73 72%,#EE9C76 100%);--star-op:.35;--bg:#2A1F55}
:root[data-theme="sky"][data-sky="day"]{--skybg:linear-gradient(180deg,#0C2A5C 0%,#1B4F98 48%,#4A8BD6 100%);--star-op:0;--bg:#123A78;--glass:rgba(8,22,60,.32)}
:root[data-theme="sky"][data-sky="dusk"]{--skybg:linear-gradient(180deg,#141038 0%,#3E1F62 38%,#93396C 70%,#E97A5A 100%);--star-op:.25;--bg:#2A1850}
:root[data-theme="sky"] .aurora{background:var(--skybg)}
:root[data-theme="sky"] .aurora::before{content:"";position:absolute;inset:0;opacity:var(--star-op,0);animation:twinkle 7s ease-in-out infinite alternate;
  background-image:radial-gradient(1.3px 1.3px at 22px 34px,#fff,transparent),radial-gradient(1px 1px at 120px 88px,#fff,transparent),radial-gradient(1.5px 1.5px at 190px 20px,#fff,transparent),
  radial-gradient(1px 1px at 70px 150px,#fff,transparent),radial-gradient(1.2px 1.2px at 160px 170px,#fff,transparent),radial-gradient(.9px .9px at 240px 120px,#fff,transparent);background-size:260px 220px}
:root[data-theme="sky"] .aurora::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.06),transparent 60%)}
@keyframes twinkle{to{opacity:calc(var(--star-op,0) * .45)}}
:root[data-theme="sky"] .glass{backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
:root[data-theme="sky"] .fab{background:linear-gradient(135deg,#FFD27A,#FF8FA3);box-shadow:0 8px 24px -6px rgba(255,170,140,.7)}
:root[data-theme="sky"] .fab svg{stroke:#2A1850}
:root[data-theme="sky"] .submit,:root[data-theme="sky"] .calc,:root[data-theme="sky"] .cta,:root[data-theme="sky"] .madd button{color:#2A1850}
:root[data-theme="sky"] .check.done .box{box-shadow:0 0 12px rgba(127,224,181,.45)}
:root[data-theme="paper"] .skyarc .arc.done,:root[data-theme="cozy"] .skyarc .arc.done,:root[data-theme="light"] .skyarc .arc.done{stroke:var(--g2)}
:root[data-theme="paper"],:root[data-theme="cozy"],:root[data-theme="light"]{--sun:#F2A13B;--moon:#9C8FC4}
</style>

<div class="aurora"><i></i><i></i><i></i></div>
<div id="app"><div class="skel glass"></div></div>

<nav class="dock" id="dock" hidden>
  <button class="tb on" data-tab="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>День</button>
  <button class="fab" id="fab" aria-label="Добавить запись"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tb" data-tab="week"><svg viewBox="0 0 24 24"><path d="M5 19V11M10 19V5M15 19v-6M20 19V9"/></svg>Неделя</button>
  <button class="tb" data-tab="money" id="moneyTab" hidden><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/><path d="M7 6V5a2 2 0 0 1 2-2h8"/></svg>Деньги</button>
  <button class="tb" data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>Цели</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Новая запись"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script>
const tg = null;  // приложение работает без Telegram
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => n == null ? '—' : Number(n).toLocaleString('ru-RU', {maximumFractionDigits: d}).replace(/ /g, ' ');
const haptic = (t = 'light') => { try { navigator.vibrate?.({light: 8, select: 5, medium: 14, heavy: 24, success: [10, 40, 18], error: [30, 50, 30]}[t] || 8) } catch (e) {} };
const pct = (v, g) => Math.max(0, Math.min(100, g ? v / g * 100 : 0));

const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WDL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MOODS = ['😫','😕','😐','🙂','😄'];
const SLOTS = [{k: 'morning', n: 'Утро', in: 'в утро'}, {k: 'day', n: 'День', in: 'в день'}, {k: 'evening', n: 'Вечер', in: 'в вечер'}];
const TYPES = {
  food:    {n: '🍽 Еда',        title: 'Что съел?',     ph: 'Гречка 200г с курицей\n2 яйца и тост с маслом', hint: 'Просто напиши, что съел — калории и БЖУ посчитаю сам (≈). Знаешь точно — пиши «Бургер 650 ккал». Можно несколько строк.', multi: true},
  workout: {n: '💪 Тренировка', title: 'Тренировка',    ph: 'Жим лёжа 4x8x60\nБег 5 км 30 мин', hint: 'Подходы×повторы×вес или минуты/км. Каждое упражнение с новой строки.', multi: true},
  water:   {n: '💧 Вода',       title: 'Вода',          ph: 'Своё количество, мл', presets: [150, 250, 330, 500, 750], unit: ' мл'},
  sleep:   {n: '😴 Сон',        title: 'Сколько спал?', ph: '7.5 или 23:30-07:15', presets: [6, 6.5, 7, 7.5, 8, 8.5, 9], unit: ' ч'},
  weight:  {n: '⚖️ Вес',        title: 'Вес',           ph: 'Например 79.4'},
  money:   {n: '💸 Траты',      title: 'На что потратил?', ph: 'Кофе 250\nТакси 1 200\n+300 000 зарплата', hint: 'Пиши как в заметках: что и сколько. Категорию определю сам. Доход — с плюсом: «+300 000 зарплата». «5к» = 5000.', multi: true},
};

let S = null, view = null, tab = 'today', slot = null, sheetType = 'food', pvTimer = null, refocus = null;

if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes?.() } catch (e) {}
  tg.BackButton?.onClick(closeSheet);
}

/* ---------------- api */
async function api(path, body) {
  try { return Core.request(path, body) }
  catch (e) { throw Object.assign(new Error(e.message || 'Ошибка'), {status: 400}) }
}
async function load(day) {
  try { S = await api('/api/state' + (day ? '?day=' + day : '')); view = S.day; $('#dock').hidden = false; render() }
  catch (e) { if (e.status === 401) return gate(); toast('Нет связи с ботом') }
}
async function mutate(path, body, ok) {
  try { S = await api(path, body); view = S.day; if (ok) { toast(ok); haptic('success') } render(); return true }
  catch (e) { toast(e.message); haptic('error'); return false }
}
function gate() { $('#app').innerHTML = `<div class="gate"><h1>Открой через Telegram</h1><p>Нажми кнопку «Трекер» в чате с ботом.</p></div>` }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1600) }
function tip(x, y, html) { const el = $('#tip'); el.innerHTML = html; el.style.left = Math.min(Math.max(x, 70), innerWidth - 70) + 'px'; el.style.top = (y - 8) + 'px'; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2000) }
const pDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const shift = (s, n) => { const d = pDate(s); d.setDate(d.getDate() + n); return iso(d) };
const mins = ts => { const [h, m] = ts.split(':').map(Number); return h * 60 + m };
const nowSlot = () => { const h = +S.now.split(':')[0]; return h >= S.dayStartHour && h < 12 ? 'morning' : h >= 12 && h < 18 ? 'day' : 'evening' };

/* ---------------- render */
function render() {
  if (!S) return;
  { const hh = +S.now.split(':')[0]; document.documentElement.dataset.sky = hh >= 5 && hh < 8 ? 'dawn' : hh >= 8 && hh < 17 ? 'day' : hh >= 17 && hh < 21 ? 'dusk' : 'night' }
  $('#app').innerHTML = `<section class="tab ${tab === 'today' ? 'on' : ''}">${today()}</section>
    <section class="tab ${tab === 'week' ? 'on' : ''}">${week()}</section>
    <section class="tab ${tab === 'money' ? 'on' : ''}">${S.money ? moneyView() : ''}</section>
    <section class="tab ${tab === 'goals' ? 'on' : ''}">${goals()}</section>`;
  const mt = $('#moneyTab'); if (mt) mt.hidden = !S.money;
  bind();
  if (refocus) { $(`form[data-add="${refocus}"] input`)?.focus(); refocus = null }
}

function rings(kp, wp, rp) {
  const R = [{r: 64, p: kp, c: 'var(--kcal)'}, {r: 47, p: wp, c: 'var(--water)'}, {r: 30, p: rp, c: 'var(--routine)'}];
  return `<svg viewBox="0 0 160 160" role="img" aria-label="Кольца дня">${R.map(x => {
    const C = 2 * Math.PI * x.r;
    return `<circle class="tr" cx="80" cy="80" r="${x.r}" stroke="${x.c}"/>
      <circle class="fg" cx="80" cy="80" r="${x.r}" stroke="${x.c}" style="color:${x.c}" transform="rotate(-90 80 80)" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.min(1, x.p))}"/>`;
  }).join('')}</svg>`;
}

function skyArc(isToday) {
  const m = mins(S.now), W = 340, H = 46, x0 = 18, x1 = W - 18;
  const pt = t => [x0 + t * (x1 - x0), H - 6 - Math.sin(t * Math.PI) * (H - 16)];
  const path = Array.from({length: 41}, (_, i) => { const [x, y] = pt(i / 40); return `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}` }).join('');
  const night = m < 360 || m >= 1260, t = Math.min(1, Math.max(0, (m - 360) / 900));
  const [sx, sy] = pt(t);
  const body = !isToday ? '' : night
    ? `<mask id="mm"><rect width="${W}" height="${H}" fill="#fff"/><circle cx="${W * .74 + 5}" cy="10" r="8" fill="#000"/></mask><circle cx="${W * .74}" cy="13" r="8" fill="var(--moon,#F3F0FF)" mask="url(#mm)"/>`
    : `<circle cx="${sx}" cy="${sy}" r="18" fill="url(#sun)"/><circle cx="${sx}" cy="${sy}" r="7" fill="var(--sun,#FFD27A)"/>`;
  return `<svg class="skyarc" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><radialGradient id="sun"><stop offset="0" stop-color="var(--sun,#FFD27A)" stop-opacity=".55"/><stop offset="1" stop-color="var(--sun,#FFD27A)" stop-opacity="0"/></radialGradient></defs>
    <line x1="0" x2="${W}" y1="${H - 6}" y2="${H - 6}" class="hz"/><path d="${path}" class="arc"/>${!night && isToday ? `<path d="${Array.from({length: Math.max(2, Math.round(t * 40) + 1)}, (_, i) => { const [x, y] = pt(i / 40); return `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}` }).join('')}" class="arc done"/>` : ''}${body}</svg>`;
}

function feed() {
  const row = (ts, color, ic, name, value, kind, id) => `<div class="row fd" data-row="${kind}:${id}"><span class="t">${ts || ''}</span><span class="fdot" style="background:${color}"></span>
    <div class="n">${ic} ${esc(name)}</div><span class="v">${esc(value)}</span><button class="x" data-del="${kind}:${id}">Удалить</button></div>`;
  const items = [
    ...S.food.items.map(it => ({ts: it.ts, h: row(it.ts, 'var(--kcal)', '🍽', it.name, fmt(it.kcal) + ' ккал', 'food', it.id)})),
    ...S.water.items.map(it => ({ts: it.ts, h: row(it.ts, 'var(--water)', '💧', 'Вода', it.ml + ' мл', 'water', it.id)})),
    ...S.workout.items.map(it => ({ts: it.ts, h: row(it.ts, 'var(--routine)', '💪', it.name, it.detail || '', 'workout', it.id)})),
    ...(S.money ? S.money.recent.filter(x => x.day === view).map(x => ({ts: x.ts, h: row(x.ts, 'var(--gold)', x.ic, x.note, (x.type === 'inc' ? '+' : '−') + fmt(x.amount) + ' ' + S.money.currency, 'money', x.id)})) : []),
  ];
  const key = ts => ts ? (mins(ts) - S.dayStartHour * 60 + 1440) % 1440 : 0;
  items.sort((a, b) => key(b.ts) - key(a.ts));
  return items.length ? items.map(i => i.h).join('') : `<div class="empty">Здесь появится всё, что запишешь: еда, вода, тренировки и траты</div>`;
}

function today() {
  const isToday = view === S.today, d = pDate(view), g = S.goals, f = S.food, R = S.habits, T = S.tasks, M = S.money;
  const ns = nowSlot(); slot = slot || ns;
  const rDone = R.filter(x => x.done).length, tDone = T.filter(x => x.done).length;
  const all = R.length + T.length, done = rDone + tDone, ringP = all ? done / all : 0, C = 2 * Math.PI * 31;
  const h = +S.now.split(':')[0], left = g.kcal - f.kcal;
  const greet = !isToday ? `${d.getDate()} ${MONTHS[d.getMonth()]}` : h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 17 ? 'Добрый день' : h < 22 ? 'Добрый вечер' : 'Доброй ночи';
  const sub = !all ? 'Добавь рутину и дела — соберу план дня' : all - done ? `сделано ${done} из ${all} · осталось ${all - done}` : 'всё сделано — ты красавчик ✨';
  const pill = (attr, ic, val, unit, p) => `<button class="pill" ${attr}><i class="pf" style="width:${Math.min(100, p || 0)}%"></i><span class="pi">${ic}</span><b>${val}</b><small>${unit}</small></button>`;
  const SL = {morning: {n: 'утро', ic: '☀️'}, day: {n: 'день', ic: '🌤'}, evening: {n: 'вечер', ic: '🌙'}}[ns];
  const nowItems = [...R.filter(x => x.slot === ns && !x.done).map(x => ({k: 'habit', id: x.id, text: x.name, tag: 'рутина'})),
    ...T.filter(x => !x.done).map(x => ({k: 'task', id: x.id, text: x.text, tag: 'дело'}))];
  const spentToday = M ? M.recent.filter(x => x.day === view && x.type === 'exp').reduce((a, x) => a + x.amount, 0) : 0;
  return `${installCard()}
  ${skyArc(isToday)}
  <header class="hero">
    <div><small class="hnavs"><button id="prev" class="hnav" aria-label="Предыдущий день">‹</button><span>${WDL[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}</span><button id="next" class="hnav" aria-label="Следующий день" ${isToday ? 'disabled' : ''}>›</button>${isToday ? '' : '<button class="hnav tdy" id="gotoday">сегодня</button>'}</small>
      <h1>${greet}</h1><p>${sub}</p></div>
    <div class="dring"><svg viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="31"/><circle class="fg" cx="38" cy="38" r="31" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - ringP)}"/></svg><b>${Math.round(ringP * 100)}<small>%</small></b></div>
  </header>

  <div class="pills">
    ${pill(isToday ? 'data-open="food"' : '', '🔥', fmt(f.kcal), '/ ' + fmt(g.kcal) + ' ккал', pct(f.kcal, g.kcal))}
    ${pill(isToday ? 'data-water="250"' : '', '💧', fmt(S.water.total / 1000, 2), '/ ' + fmt(g.water / 1000, 1) + ' л', pct(S.water.total, g.water))}
    ${pill(isToday ? 'data-open="sleep"' : '', '😴', S.sleep ? fmt(S.sleep, 1) : '—', 'ч сна', pct(S.sleep || 0, g.sleep))}
    ${M ? pill('data-tab-go="money"', '💸', fmt(spentToday), M.currency + (isToday ? ' сегодня' : ''), M.perDayLeft ? pct(spentToday, M.perDayLeft) : 0) : ''}
    ${pill(isToday ? 'data-open="weight"' : '', '⚖️', S.weight.kg ? fmt(S.weight.kg, 1) : '—', 'кг', 0)}
  </div>

  ${isToday ? `<div class="glass now">
    <div class="now-h"><span>${SL.ic}</span><div><b>Сейчас ${SL.n}</b><small>${nowItems.length ? `${nowItems.length} ${plural(nowItems.length, 'пункт', 'пункта', 'пунктов')} на эту часть дня` : 'на сейчас всё сделано'}</small></div></div>
    ${nowItems.slice(0, 4).map(x => check(x.k, x.id, x.text, false, `<span class="tag">${x.tag}</span>`)).join('') || `<div class="empty">${all ? 'Всё на эту часть дня выполнено ✨' : 'Заполни план ниже — здесь появится, что сделать сейчас.'}</div>`}
    ${nowItems.length > 4 ? `<button class="more" data-jump="routine">и ещё ${nowItems.length - 4} — весь план ↓</button>` : ''}
  </div>

  <div class="qgrid">
    <button class="qb" data-open="food"><span>🍽</span>Еда</button>
    <button class="qb" data-water="250"><span>💧</span>+250 мл</button>
    <button class="qb" data-open="workout"><span>💪</span>Спорт</button>
    ${M ? '<button class="qb" data-open="money"><span>💸</span>Трата</button>' : ''}
    <button class="qb" data-open="sleep"><span>😴</span>Сон</button>
    <button class="qb" data-open="weight"><span>⚖️</span>Вес</button>
  </div>` : ''}

  <div class="glass moodc"><small>${isToday ? 'Как ты сегодня?' : 'Настроение'}</small>
    <div class="moods">${MOODS.map((e, i) => `<button class="${S.mood?.score === i + 1 ? 'on' : ''}" ${isToday ? `data-mood="${i + 1}"` : 'disabled'} aria-label="Настроение ${i + 1}">${e}</button>`).join('')}</div></div>

  <div class="h2"><h2>Лента дня</h2><span>тап — удалить</span></div>
  <div class="glass card feed">${feed()}</div>

  <div class="h2" id="routine"><h2>План</h2><span>${R.length ? rDone + ' из ' + R.length + ' в рутине' : ''}</span></div>
  <div class="glass card">${routine()}</div>

  <div class="h2"><h2>Дела</h2>${S.carry ? `<button id="carry">Перенести со вчера (${S.carry})</button>` : `<span>${T.length ? tDone + ' из ' + T.length : ''}</span>`}</div>
  <div class="glass card">
    ${T.map(t => check('task', t.id, t.text, t.done)).join('')}
    ${isToday ? `<form class="adder" data-add="task"><input placeholder="Новое дело" maxlength="200" enterkeyhint="done"><button aria-label="Добавить">+</button></form>` : T.length ? '' : '<div class="empty">Дел не было</div>'}
  </div>

  <div class="h2"><h2>Питание</h2>${isToday ? '<button data-open="food">+ Добавить</button>' : ''}</div>
  <div class="glass card pad receipt">
    <div class="kc"><b>${fmt(f.kcal)}</b><span>из ${fmt(g.kcal)} ккал · ${left >= 0 ? 'ещё ' + fmt(left) : '+' + fmt(-left)}</span></div>
    <div class="pbar"><i style="width:${pct(f.kcal, g.kcal)}%"></i></div>
    <div class="macros">
      ${[['Белки', f.protein, g.protein, '#FF8A5C'], ['Жиры', f.fat, g.fat, 'var(--gold)'], ['Углеводы', f.carbs, g.carbs, 'var(--water)']].map(([n, v, goal, c]) =>
        `<div class="macro"><small>${n}</small><b>${fmt(v)}<span> / ${fmt(goal)} г</span></b><div class="mb"><i style="width:${pct(v, goal)}%;background:${c}"></i></div></div>`).join('')}
    </div>
    <div class="rc">${f.items.length ? f.items.map(it => `<div class="rc-row"><span>${esc(it.name)}</span><i></i><b>${fmt(it.kcal)}</b></div>`).join('') : '<div class="rc-empty">чек пока пустой</div>'}
      <div class="rc-row rc-total"><span>ИТОГО</span><i></i><b>${fmt(f.kcal)} ккал</b></div></div>
    ${S.profile.norm ? '' : `<button class="h2" style="margin:12px 0 0;font-size:13.5px;color:var(--water);font-weight:700" data-tab-go="goals">🧮 Посчитать мою норму →</button>`}
  </div>`;
}

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; render() });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function installCard() {
  let hidden = false; try { hidden = localStorage.getItem('install-hidden') === '1' } catch (e) {}
  if (isStandalone() || hidden) return '';
  const txt = deferredInstall ? '<b>Установи как приложение</b><small>Иконка на главном экране, работает без интернета</small>'
    : isIOS() ? '<b>Установи на главный экран</b><small>В Safari нажми «Поделиться» ⬆️ → «На экран Домой»</small>'
    : '<b>Установи на главный экран</b><small>Меню браузера ⋮ → «Установить приложение» / «На главный экран»</small>';
  return `<div class="glass install"><div style="flex:1">${txt}</div>${deferredInstall ? '<button class="go" id="installBtn">Установить</button>' : ''}<button class="x" id="installHide" aria-label="Скрыть">×</button></div>`;
}

function check(kind, id, text, done, meta = '') {
  return `<div class="check ${kind} ${done ? 'done' : ''}" data-toggle="${kind}:${id}">
    <span class="box"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
    <span class="txt">${esc(text)}</span>
    <span class="meta">${meta}<button class="del" data-del="${kind}:${id}" aria-label="Удалить">×</button></span></div>`;
}
function routine() {
  const R = S.habits, sl = SLOTS.find(s => s.k === slot);
  if (!R.length) return `<div class="empty">Утро, день и вечер со своими пунктами. Отмечай их — у каждого копится серия дней подряд 🔥</div>
    <button class="cta" id="tpl">✨ Заполнить готовой рутиной</button>`;
  const items = R.filter(h => h.slot === slot);
  return `<div class="seg">${SLOTS.map(s => { const it = R.filter(h => h.slot === s.k); return `<button data-slot="${s.k}" class="${s.k === slot ? 'on' : ''}">${s.n} <span>${it.filter(h => h.done).length}/${it.length}</span></button>` }).join('')}</div>
    ${items.map(h => check('habit', h.id, h.name, h.done, h.streak >= 2 ? `<span class="streak">🔥 ${h.streak}</span>` : '')).join('')}
    ${items.length ? '' : '<div class="empty">Пока пусто — добавь первый пункт</div>'}
    <form class="adder" data-add="habit"><input placeholder="Добавить ${sl.in}" maxlength="100" enterkeyhint="done"><button aria-label="Добавить">+</button></form>`;
}
function workout(isToday) {
  const w = S.workout;
  if (!w.items.length) return `<div class="empty" style="padding:0">${isToday ? 'Сегодня без тренировки' : 'Тренировки не было'}</div>`;
  const st = [];
  if (w.volume) st.push(['Объём', fmt(w.volume) + ' кг']);
  if (w.sets) st.push(['Подходы', w.sets]);
  if (w.minutes) st.push(['Время', fmt(w.minutes) + ' мин']);
  if (w.km) st.push(['Дистанция', fmt(w.km, 1) + ' км']);
  return `<div class="stats">${st.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>
    ${w.items.map(it => `<div class="row"><span class="t">${it.ts}</span><div class="n">${esc(it.name)}</div><span class="v">${esc(it.detail || '')}</span></div>`).join('')}`;
}
function entries() {
  const row = (ts, color, name, sub, value, kind, id) => `<div class="row" data-row="${kind}:${id}"><span class="t">${ts}</span>
    <div class="n"><i style="background:var(${color})"></i>${esc(name)}${sub ? ` <small>${esc(sub)}</small>` : ''}</div><span class="v">${esc(value)}</span>
    <button class="x" data-del="${kind}:${id}">Удалить</button></div>`;
  const items = [
    ...S.food.items.map(it => ({ts: it.ts, h: row(it.ts, '--kcal', it.name, '', fmt(it.kcal) + ' ккал', 'food', it.id)})),
    ...S.water.items.map(it => ({ts: it.ts, h: row(it.ts, '--water', 'Вода', '', it.ml + ' мл', 'water', it.id)})),
    ...S.workout.items.map(it => ({ts: it.ts, h: row(it.ts, '--routine', it.name, '', it.detail || '', 'workout', it.id)})),
  ];
  const key = ts => (mins(ts) - S.dayStartHour * 60 + 1440) % 1440;
  items.sort((a, b) => key(b.ts) - key(a.ts));
  return items.length ? items.map(i => i.h).join('') : `<div class="empty">Здесь появится всё, что запишешь за день</div>`;
}

/* ---------------- week */
function dayScore(d) {
  const g = S.goals, parts = [];
  const active = d.kcal != null || d.water || d.sleep || d.trained || d.tasksDone || d.habitsDone || d.mood;
  if (!active) return null;
  if (d.kcal != null) parts.push(Math.max(0, 1 - Math.abs(d.kcal - g.kcal) / g.kcal));
  if (d.water) parts.push(Math.min(1, d.water / g.water));
  if (d.sleep) parts.push(Math.min(1, d.sleep / g.sleep));
  if (d.habitsTotal) parts.push(d.habitsDone / d.habitsTotal);
  if (d.tasksTotal) parts.push(d.tasksDone / d.tasksTotal);
  if (d.trained) parts.push(1);
  return parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : null;
}
function week() {
  const W = S.week, g = S.goals, M = S.money;
  const scores = W.map(dayScore), valid = scores.filter(x => x != null);
  const avgScore = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null, C = 2 * Math.PI * 31;
  const bestI = valid.length ? scores.indexOf(Math.max(...valid)) : -1;
  const f = pDate(W[0].day), l = pDate(W[6].day), isCur = W[6].day === S.today;
  const avg = arr => { const xs = arr.filter(v => v != null && v !== 0); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null };
  const strip = W.map((d, i) => { const sc = scores[i]; return `<button class="wd ${d.day === view ? 'sel' : ''} ${d.day === S.today ? 'td' : ''}" data-goday="${d.day}" aria-label="${d.wd} ${d.num}">
      <small>${d.wd}</small><div class="wbar"><i style="height:${sc == null ? 0 : Math.max(8, sc * 100)}%"></i></div><b>${d.num}</b><span>${d.mood ? MOODS[d.mood - 1] : '·'}</span></button>` }).join('');
  const bars = (vals, goal, color, fv) => {
    const mx = Math.max(goal || 0, ...vals.map(v => v || 0)) * 1.08 || 1;
    return `<div class="sbars">${goal ? `<i class="gl" style="bottom:${goal / mx * 100}%"></i>` : ''}${vals.map((v, i) => `<span data-tip="${v ? esc(`<b>${fv(v)}</b><small>${W[i].wd}, ${W[i].num}</small>`) : ''}"><i style="height:${v ? Math.max(5, v / mx * 100) : 0}%;background:${color}"></i></span>`).join('')}</div>
      <div class="sdays">${W.map(d => `<span class="${d.day === S.today ? 'td' : ''}">${d.wd}</span>`).join('')}</div>`;
  };
  const mc = (title, val, unit, sub, chart) => `<div class="glass mc"><small>${title}</small><b>${val}<span>${unit}</span></b><em>${sub}</em>${chart}</div>`;
  const kc = W.map(d => d.kcal), wa = W.map(d => d.water), sl = W.map(d => d.sleep), sp = W.map(d => d.spent);
  const HB = S.weekHabits || [];
  const ins = [];
  if (bestI >= 0 && valid.length > 1) ins.push(['🏆', `Лучший день — ${WDL[pDate(W[bestI].day).getDay()].toLowerCase()}`, `${Math.round(scores[bestI] * 100)}% целей выполнено`]);
  const aS = avg(sl); if (aS) ins.push(['😴', aS < g.sleep - .6 ? `Недосып: ${fmt(aS, 1)} ч в среднем` : `Сон в норме: ${fmt(aS, 1)} ч`, aS < g.sleep - .6 ? `на ${fmt(g.sleep - aS, 1)} ч меньше цели — ложись на полчаса раньше` : 'так держать']);
  const aW = avg(wa); if (aW) ins.push(['💧', aW < g.water * .8 ? `Воды маловато: ${fmt(aW / 1000, 1)} л в день` : `Вода в норме: ${fmt(aW / 1000, 1)} л в день`, `цель — ${fmt(g.water / 1000, 1)} л`]);
  const tr = W.filter(d => d.trained).length; ins.push(['💪', tr ? `Тренировок: ${tr} из 7` : 'Без тренировок', tr >= 3 ? 'отличный ритм' : 'цель — 3 в неделю']);
  if (HB.length) { const top = [...HB].sort((a, b) => b.days.filter(Boolean).length - a.days.filter(Boolean).length)[0], n = top.days.filter(Boolean).length; if (n >= 3) ins.push(['🔥', `Стабильнее всего — «${esc(top.name)}»`, `${n} из 7 дней`]) }
  return `<header class="hero">
      <div><small class="hnavs"><button id="wprev" class="hnav" aria-label="Прошлая неделя">‹</button><span>${f.getDate()} ${MON[f.getMonth()]} — ${l.getDate()} ${MON[l.getMonth()]}</span><button id="wnext" class="hnav" aria-label="Следующая неделя" ${isCur ? 'disabled' : ''}>›</button></small>
        <h1>Неделя</h1><p>${avgScore == null ? 'Записывай дни — здесь появится итог' : `в среднем ${Math.round(avgScore * 100)}% целей в день`}</p></div>
      <div class="dring"><svg viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="31"/><circle class="fg" cx="38" cy="38" r="31" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (avgScore || 0))}"/></svg><b>${avgScore == null ? '—' : Math.round(avgScore * 100)}<small>${avgScore == null ? '' : '%'}</small></b></div>
    </header>
    <div class="glass wstrip">${strip}</div>

      ${mc('💧 Вода', avg(wa) ? fmt(avg(wa) / 1000, 1) : '—', ' л', `в среднем · цель ${fmt(g.water / 1000, 1)}`, bars(wa, g.water, 'var(--water)', v => fmt(v) + ' мл'))}
      ${mc('😴 Сон', avg(sl) ? fmt(avg(sl), 1) : '—', ' ч', `в среднем · цель ${fmt(g.sleep, 1)}`, bars(sl, g.sleep, 'var(--sleep)', v => fmt(v, 1) + ' ч'))}
      ${M ? mc('💸 Траты', fmt(sp.reduce((a, b) => a + (b || 0), 0)), ' ' + M.currency, 'за неделю', bars(sp, M.budget ? M.budget / 30 : null, 'var(--gold)', v => fmt(v) + ' ' + M.currency)) : ''}
    </div>

    <div class="glass card pad hgrid"><div class="hg-row hg-head"><span></span>${W.map(d => `<small class="${d.day === S.today ? 'td' : ''}">${d.wd}</small>`).join('')}</div>
      ${HB.map(h => `<div class="hg-row"><span>${esc(h.name)}</span>${h.days.map(x => `<i class="${x ? 'on' : ''}"></i>`).join('')}</div>`).join('')}</div>` : ''}
    <div class="h2"><h2>Вес</h2></div><div class="glass card pad">${weightChart()}</div>`;
}
function weightChart() {
  const H = S.weight.history;
  if (H.length < 2) return `<div class="empty" style="padding:0">График появится после двух замеров веса</div>`;
  const Wd = 340, Ht = 170, pl = 34, pr = 8, pt = 10, pb = 22;
  const xs = H.map(p => p.kg), lo = Math.floor(Math.min(...xs) - .5), hi = Math.ceil(Math.max(...xs) + .5);
  const X = i => pl + (i / (H.length - 1)) * (Wd - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (Ht - pt - pb);
  const line = H.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.kg).toFixed(1)}`).join('');
  const last = H[H.length - 1], diff = last.kg - H[0].kg, dl = s => { const d = pDate(s); return `${d.getDate()} ${MON[d.getMonth()]}` };
  window._wc = {H, X, Y, Wd, Ht, dl};
  return `<div class="big">${fmt(last.kg, 1)}<span>кг · ${diff > 0 ? '+' : ''}${fmt(diff, 1)} за период</span></div>
    <svg class="chart" id="wchart" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="График веса">
      <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></linearGradient></defs>
      <g class="gl">${[lo, (lo + hi) / 2, hi].map(t => `<line x1="${pl}" x2="${Wd - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end">${fmt(t, 1)}</text>`).join('')}</g>
      <text class="ax" x="${pl}" y="${Ht - 4}">${dl(H[0].day)}</text><text class="ax" x="${Wd - pr}" y="${Ht - 4}" text-anchor="end">${dl(last.day)}</text>
      <path class="ln" d="${line}"/>
      <line class="cross" id="wx" y1="${pt}" y2="${Ht - pb}" x1="-9" x2="-9"/><circle class="pt" id="wp" r="5" cx="-9" cy="-9"/>
      <circle class="pt" cx="${X(H.length - 1)}" cy="${Y(last.kg)}" r="4.5"/>
    </svg>`;
}

function applyThemeColors() {
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', bg);
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor?.(bg) } catch (e) {}
}
function setTheme(k) {
  document.documentElement.dataset.theme = k;
